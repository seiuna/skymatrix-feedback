name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 描述希望增加的功能或调整后的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的替代方案
      description: 如果有，请描述目前的处理办法及其不足。
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可以附上示例、截图或参考链接。
